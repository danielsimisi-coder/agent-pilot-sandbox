name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen acceptance in read-only sandbox
        run: python3 pilot/run_acceptance.py
      - name: Pinned Coverloop evidence gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/coverloop" https://raw.githubusercontent.com/danielsimisi-coder/coverloop/dcea430810c3d75f0462b697d129b0abddb94c6b/bin/coverloop
          echo "f18f4783cfec73d119dc853771d216c6d353fdab163a752fb46a7973d016fade  $RUNNER_TEMP/coverloop" | sha256sum -c -
          python3 "$RUNNER_TEMP/coverloop" gate --ci --min-tier L3 --require-transcript --human-gate-scope irreversible --base "$BASE_SHA"
